<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMS Matematika</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  display:flex;
  background:#f4f7fb;
}

/* SIDEBAR */
.sidebar {
  width:220px;
  background:#1e88e5;
  color:white;
  height:100vh;
  padding:20px;
}

.sidebar h2 {
  text-align:center;
}

.sidebar button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  background:none;
  color:white;
  text-align:left;
  cursor:pointer;
  border-radius:8px;
}

.sidebar button:hover {
  background:#1565c0;
}

/* MAIN */
.main {
  flex:1;
  padding:20px;
}

.header {
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* CONTENT */
.content {
  display:none;
}

.active {
  display:block;
}

/* CARD */
.card {
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 3px 6px rgba(0,0,0,0.1);
}

.card a {
  display:block;
  margin-top:10px;
  color:#1e88e5;
  text-decoration:none;
}

.card a:hover {
  text-decoration:underline;
}

/* LOGIN */
#loginBox {
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-card {
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 3px 10px rgba(0,0,0,0.2);
  width:300px;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
}

button.primary {
  width:100%;
  background:#1e88e5;
  color:white;
  border:none;
  padding:10px;
  margin-top:15px;
  border-radius:8px;
  cursor:pointer;
}

button.primary:hover {
  background:#1565c0;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <div class="login-card">
    <h2>Login LMS</h2>
    <input type="text" id="username" placeholder="Nama">
    <select id="role">
      <option value="siswa">Siswa</option>
      <option value="guru">Guru</option>
    </select>
    <button class="primary" onclick="login()">Masuk</button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>LMS</h2>
  <button onclick="openMenu('dashboard')">🏠 Dashboard</button>
  <button onclick="openMenu('materi')">📚 Materi</button>
  <button onclick="openMenu('latihan')">🧠 Latihan</button>
  <button onclick="openMenu('tugas')">📝 Tugas</button>
  <button onclick="openMenu('nilai')">📊 Nilai</button>
  <button onclick="logout()">🚪 Logout</button>
</div>

<!-- MAIN -->
<div class="main">

<div class="header">
  <h2 id="welcome">Halo</h2>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="content active">
  <div class="card">
    <h3>Selamat Datang</h3>
    <p>Gunakan LMS ini untuk belajar matematika dengan lebih mudah dan interaktif.</p>
  </div>
</div>

<!-- MATERI -->
<div id="materi" class="content">
  <div class="card">
    <h3>Materi</h3>
    <a href="https://drive.google.com/drive/folders/19fXvCwJmOpQLSPDEidrH-oQO_yuK3Srd?usp=drive_link" target="_blank">📥 Download Materi 1</a>
    <a href="LINK_MATERI_2" target="_blank">📥 Download Materi 2</a>
  </div>
</div>

<!-- LATIHAN -->
<div id="latihan" class="content">
  <div class="card">
    <h3>Latihan Soal</h3>
    <p>2 + 3 = ?</p>
    <input id="jawab">
    <button class="primary" onclick="cek()">Cek</button>
    <p id="hasil"></p>
  </div>
</div>

<!-- TUGAS -->
<div id="tugas" class="content">
  <div class="card">
    <h3>Kumpulkan Tugas</h3>
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSd13ZgGXpU1jcg2jgc1lc80HGgOvsdmMAF4SHijyEchNXd6NQ/viewform" width="100%" height="500"></iframe>
  </div>
</div>

<!-- NILAI -->
<div id="nilai" class="content">
  <div class="card">
    <h3>Nilai Siswa</h3>
    <iframe src="https://docs.google.com/spreadsheets/d/1rPjg4I7lWjx7ktOACu7QNv4eeUN1-NtXYUSjvieMhQI/edit?resourcekey=&gid=91890700#gid=91890700" width="100%" height="400"></iframe>
  </div>
</div>

</div>

<script>
function openMenu(menu){
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  document.getElementById(menu).classList.add('active');
}

function login(){
  let user = username.value;
  localStorage.setItem('user', user);
  loginBox.style.display = 'none';
  welcome.innerText = "Halo, " + user;
}

function logout(){
  localStorage.clear();
  location.reload();
}

function cek(){
  let j = document.getElementById('jawab').value;
  hasil.innerText = (j == 5) ? "Benar 👍" : "Salah ❌";
}

window.onload = function(){
  let user = localStorage.getItem('user');
  if(user){
    loginBox.style.display = 'none';
    welcome.innerText = "Halo, " + user;
  }
}
</script>

</body>
</html>
